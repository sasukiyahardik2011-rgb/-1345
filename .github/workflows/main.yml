            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          echo ""
          echo "Generated APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          du -h "$APK"

          echo ""
          echo "========================================"
          echo "        PANDA GAME APK READY"
          echo "========================================"      -print



      # 12. Find Generated APK
      - name: Find Generated APK
        shell: bash
        run: |
          echo "========================================"
          echo "Searching Generated APK"
          echo "========================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build output folders:"

            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 13. Upload PANDA GAME APK
      - name: Upload PANDA GAME APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDA-GAME-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
