name: Build PANDA GAME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Extract Game ZIP
        shell: bash
        run: |
          set -e

          echo "Searching ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          echo "Extracting ZIP..."

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            echo "Files found after extraction:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle file missing!"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle file missing!"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing!"
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          fi

          echo "APK build completed."

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDA-GAME-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
