name: Build PANDA GAME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      # 6. Find ZIP
      - name: Find Game ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 7. Extract ZIP
      - name: Extract Game Project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      # 8. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Full extracted structure:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 9. Verify project
      - name: Verify Android Project
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle" \
            || {
              echo "ERROR: Gradle settings file missing."
              exit 1
            }

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle" \
            || {
              echo "ERROR: Root build.gradle file missing."
              exit 1
            }

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle" \
            || {
              echo "ERROR: app/build.gradle file missing."
              exit 1
            }

          echo "Android project verification successful."

      # 10. Show Gradle information
      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      # 11. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building project from:"
          pwd

          echo "Project files:"
          ls -la

          echo "Starting Gradle build..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              --warning-mode all
          else
            gradle assembleDebug \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              --warning-mode all
          fi

      # 12. Find APK
      - name: Find Generated APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build output folders:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 13. Upload APK
      - name: Upload PANDA GAME APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDA-GAME-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
