name: PANDA GAME - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PANDA GAME APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # --------------------------------------------------
      # 4. Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # --------------------------------------------------
      # 5. Find ZIP
      # --------------------------------------------------
      - name: Find PANDA GAME ZIP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Searching for PANDA GAME ZIP..."
          echo "===================================="

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PANDA GAME ZIP not found!"
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Extract ZIP
      # --------------------------------------------------
      - name: Extract PANDA GAME
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "app/build.gradle.kts" \
            -o -name "app/build.gradle" \) \
            -print

      # --------------------------------------------------
      # 7. Find Android project
      # --------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Searching for Android project..."
          echo "===================================="

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts / settings.gradle not found!"
            echo ""
            echo "Extracted repository:"
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Verify project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Verifying Android project..."
          echo "===================================="

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "gradle.properties" \
            -o -name "gradle-wrapper.properties" \) \
            -print

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: Android settings file missing!"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) missing!"
            exit 1
          fi

          echo ""
          echo "Android project verified successfully."

      # --------------------------------------------------
      # 9. Create Debug Keystore
      # --------------------------------------------------
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."

      # --------------------------------------------------
      # 10. Create build-only google-services.json
      # --------------------------------------------------
      - name: Create build-only Firebase configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p app

          if [ ! -f "app/google-services.json" ]; then

            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "panda-game-build",
              "storage_bucket": "panda-game-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.pandagame.voxelbox"
                  }
                },
                "api_key": [
                  {
                    "current_key": "000000000000000000000000000000000000000"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

            echo "Build-only google-services.json created."

          else
            echo "Existing google-services.json found."
          fi

      # --------------------------------------------------
      # 11. Disable problematic KSP/CI cache behaviour
      # --------------------------------------------------
      - name: Prepare CI build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Preparing clean CI build..."

          rm -rf .gradle
          rm -rf app/build
          rm -rf build

          echo "Clean build directories removed."

      # --------------------------------------------------
      # 12. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "BUILDING PANDA GAME APK"
          echo "===================================="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --refresh-dependencies \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # --------------------------------------------------
      # 13. Show useful error if build fails
      # --------------------------------------------------
      - name: Show build error
        if: failure()
        shell: bash
        run: |
          echo "===================================="
          echo "BUILD FAILED - IMPORTANT ERROR"
          echo "===================================="

          if [ -f "$GITHUB_WORKSPACE/gradle-build.log" ]; then

            echo ""
            echo "---- What went wrong ----"

            grep -n -A 20 -B 5 \
              "What went wrong" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              || true

            echo ""
            echo "---- FAILED tasks ----"

            grep -n \
              "FAILED" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              || true

            echo ""
            echo "---- Exceptions ----"

            grep -n -E \
              "Exception|Caused by:|e: |error:" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | head -n 100 \
              || true

          fi

      # --------------------------------------------------
      # 14. Find APK
      # --------------------------------------------------
      - name: Find Generated APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "GENERATED PANDA GAME APK"
          echo "===================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload PANDA GAME APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PANDA-GAME-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
